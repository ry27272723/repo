<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时空迷局 - 交互叙事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            position: relative;
        }

        /* 动态背景粒子 */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* 主容器 */
        #game-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        /* 状态面板 */
        #status-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideInRight 0.5s ease-out;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .status-item {
            color: #fff;
            margin: 8px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-label {
            opacity: 0.7;
        }

        .status-value {
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        /* 故事卡片 */
        #story-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInScale 0.6s ease-out;
            backdrop-filter: blur(20px);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        #story-title {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        #story-text {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 30px;
            min-height: 120px;
        }

        /* 选择按钮容器 */
        #choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .choice-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .choice-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .choice-btn:active {
            transform: translateY(-1px);
        }

        .choice-btn span {
            position: relative;
            z-index: 1;
        }

        /* 结局卡片 */
        .ending-card {
            text-align: center;
        }

        .ending-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ending-text {
            font-size: 20px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
        }

        #restart-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        #restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
        }

        /* 打字机效果 */
        .typing {
            overflow: hidden;
            white-space: pre-wrap;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            #story-card {
                padding: 30px 20px;
            }

            #story-title {
                font-size: 24px;
            }

            #story-text {
                font-size: 16px;
            }

            #status-bar {
                top: 10px;
                right: 10px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <div id="status-bar">
        <div class="status-item">
            <span class="status-label">🎭 角色:</span>
            <span class="status-value" id="character">未知</span>
        </div>
        <div class="status-item">
            <span class="status-label">⭐ 声望:</span>
            <span class="status-value" id="reputation">0</span>
        </div>
        <div class="status-item">
            <span class="status-label">💰 财富:</span>
            <span class="status-value" id="wealth">0</span>
        </div>
        <div class="status-item">
            <span class="status-label">🔮 神秘度:</span>
            <span class="status-value" id="mystery">0</span>
        </div>
    </div>

    <div id="game-container">
        <div id="story-card">
            <h1 id="story-title"></h1>
            <div id="story-text"></div>
            <div id="choices"></div>
        </div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            character: '探索者',
            reputation: 0,
            wealth: 0,
            mystery: 0,
            currentScene: 'start'
        };

        // 故事场景定义
        const scenes = {
            start: {
                title: '神秘的邀请函',
                text: '深夜，你收到一封没有署名的邀请函。羊皮纸上用优雅的花体字写着："午夜时分，古老的钟楼见。你的命运，将在此改写。"\n\n窗外月光如水，远处的钟楼若隐若现。你感到一股莫名的召唤...',
                choices: [
                    {
                        text: '立即前往钟楼，探寻真相',
                        effects: { mystery: 10, reputation: 5 },
                        nextScene: 'tower'
                    },
                    {
                        text: '先调查邀请函的来历',
                        effects: { mystery: 5, wealth: 10 },
                        nextScene: 'investigate'
                    },
                    {
                        text: '无视邀请函，继续睡觉',
                        effects: { wealth: -5 },
                        nextScene: 'dream'
                    }
                ]
            },
            tower: {
                title: '钟楼的秘密',
                text: '你来到古老的钟楼下。铁门虚掩着，里面传来神秘的低语声。月光透过破碎的窗户洒在地上，形成诡异的光影图案。\n\n突然，你听到楼上传来脚步声...',
                choices: [
                    {
                        text: '悄悄跟踪脚步声',
                        effects: { mystery: 15, reputation: 10 },
                        nextScene: 'follow'
                    },
                    {
                        text: '大声质问是谁',
                        effects: { reputation: 20 },
                        nextScene: 'confront'
                    },
                    {
                        text: '在一楼寻找线索',
                        effects: { wealth: 15, mystery: 5 },
                        nextScene: 'search'
                    }
                ]
            },
            investigate: {
                title: '线索追踪',
                text: '你仔细检查邀请函，发现纸张有特殊的水印。在灯光下，隐藏的文字显现："时间倒流者协会"。\n\n这是一个传说中的神秘组织，据说掌握着时间的秘密...',
                choices: [
                    {
                        text: '前往图书馆查找资料',
                        effects: { mystery: 20, wealth: 5 },
                        nextScene: 'library'
                    },
                    {
                        text: '联系神秘学专家',
                        effects: { reputation: 15, wealth: 10 },
                        nextScene: 'expert'
                    },
                    {
                        text: '现在赶往钟楼',
                        effects: { mystery: 10 },
                        nextScene: 'tower'
                    }
                ]
            },
            dream: {
                title: '预知梦境',
                text: '你进入了一个奇怪的梦境。梦中，你看到自己站在一个巨大的时钟面前，指针疯狂地倒转。一个声音回荡："有些命运，无法逃避..."\n\n惊醒后，你发现邀请函在发光！',
                choices: [
                    {
                        text: '立刻前往钟楼',
                        effects: { mystery: 25, reputation: 5 },
                        character: '预言者',
                        nextScene: 'tower'
                    },
                    {
                        text: '记录梦境细节',
                        effects: { mystery: 15, wealth: 20 },
                        character: '智者',
                        nextScene: 'investigate'
                    }
                ]
            },
            follow: {
                title: '时空裂缝',
                text: '你跟随脚步声来到钟楼顶层。眼前的景象让你震惊：空间中浮现出无数个时间裂缝，每个裂缝都通往不同的时空。\n\n一个戴着面具的人转身看向你："欢迎来到时间的交汇点，选择者。"',
                choices: [
                    {
                        text: '跳入过去的裂缝',
                        effects: { mystery: 30, reputation: 20 },
                        nextScene: 'past'
                    },
                    {
                        text: '跳入未来的裂缝',
                        effects: { mystery: 30, wealth: 30 },
                        nextScene: 'future'
                    },
                    {
                        text: '拒绝选择，质问对方',
                        effects: { reputation: 25, mystery: 15 },
                        nextScene: 'truth'
                    }
                ]
            },
            confront: {
                title: '勇敢的挑战',
                text: '你的声音在钟楼中回荡。楼梯上出现一道光芒，一位优雅的女士缓步走下。\n\n"勇气可嘉，"她微笑道，"但在时间面前，勇气并非唯一的武器。"',
                choices: [
                    {
                        text: '展现你的智慧',
                        effects: { reputation: 30, mystery: 15 },
                        nextScene: 'wisdom'
                    },
                    {
                        text: '请求指引',
                        effects: { mystery: 20, reputation: 10 },
                        nextScene: 'guidance'
                    }
                ]
            },
            search: {
                title: '宝贵的发现',
                text: '在钟楼一楼，你发现了一本古老的日记。日记记载着"时间倒流者协会"的秘密：每个选择都会在时空中留下痕迹，而你，正是被选中的时空守护者。',
                choices: [
                    {
                        text: '接受时空守护者的命运',
                        effects: { mystery: 40, reputation: 30, wealth: 20 },
                        nextScene: 'guardian'
                    },
                    {
                        text: '继续探索钟楼秘密',
                        effects: { mystery: 25, wealth: 25 },
                        nextScene: 'follow'
                    }
                ]
            },
            library: {
                title: '知识的力量',
                text: '在古老图书馆的禁书区，你找到了协会的完整历史。原来，时间倒流者协会守护着世界的时间线，而你被选中成为新的成员。',
                choices: [
                    {
                        text: '接受邀请，加入协会',
                        effects: { mystery: 35, reputation: 25, wealth: 15 },
                        character: '学者',
                        nextScene: 'member'
                    },
                    {
                        text: '带着知识前往钟楼',
                        effects: { mystery: 30, reputation: 15 },
                        nextScene: 'follow'
                    }
                ]
            },
            expert: {
                title: '专家的警告',
                text: '神秘学专家脸色凝重："时间倒流者协会...那是一个危险的组织。他们操纵时间，改变命运。但代价是...你可能会失去自己原本的存在。"',
                choices: [
                    {
                        text: '不惧危险，前往钟楼',
                        effects: { reputation: 35, mystery: 20 },
                        character: '冒险家',
                        nextScene: 'tower'
                    },
                    {
                        text: '请专家一同前往',
                        effects: { reputation: 25, wealth: 20, mystery: 15 },
                        nextScene: 'together'
                    }
                ]
            },
            past: {
                title: '回到过去',
                text: '你跳入了过去的裂缝。眼前是一个古老的王国，而你发现自己竟然是改变历史的关键人物。你的每个选择都将重塑现在...',
                ending: true,
                endingType: '时空改写者',
                endingText: '你成为了历史的塑造者，在过去和现在之间架起桥梁。你的选择改变了无数人的命运，而你也成为了传说中的时空行者。'
            },
            future: {
                title: '窥见未来',
                text: '未来的世界充满科技与魔法的融合。你看到了自己的可能性，看到了无数个平行世界中的自己。你明白了：每个选择都创造了一个新的未来。',
                ending: true,
                endingType: '未来先知',
                endingText: '你获得了预见未来的能力，成为引导人们走向最好命运的先知。你的智慧照亮了无数人的道路。'
            },
            truth: {
                title: '真相揭露',
                text: '面具人摘下面具，露出的竟是未来的你自己。"这一切都是测试，"你说，"时间是个圈，而你通过了考验。"',
                ending: true,
                endingType: '时间掌控者',
                endingText: '你理解了时间的真谛：过去、现在、未来都是一体的。你成为了真正的时间掌控者，守护着时空的平衡。'
            },
            wisdom: {
                title: '智慧的试炼',
                text: '你用智慧回答了女士的所有问题，展现出对时间本质的深刻理解。她赞许地点头："你已经准备好了。"',
                ending: true,
                endingType: '智慧贤者',
                endingText: '你的智慧征服了时间的考验。你被授予"时间贤者"的称号，成为指引迷途者的明灯。'
            },
            guidance: {
                title: '导师的传承',
                text: '女士成为了你的导师，教导你时间的奥秘。在她的指引下，你逐步成长为新一代的时间守护者。',
                ending: true,
                endingType: '传承者',
                endingText: '在导师的培养下，你继承了时间守护者的使命。你将用一生去守护时空的秩序，保护无数个世界。'
            },
            guardian: {
                title: '守护者的觉醒',
                text: '当你接受使命的那一刻，整个钟楼亮起璀璨的光芒。时间的力量涌入你的身体，你感觉到与整个时空的连接。',
                ending: true,
                endingType: '时空守护者',
                endingText: '你成为了时空守护者，肩负起维护时间线的重大使命。你的名字将在时空中永存，守护着无数个世界的平衡。'
            },
            member: {
                title: '协会的新成员',
                text: '你正式加入时间倒流者协会。在这里，你学习到了前所未有的知识，结识了来自不同时空的伙伴。新的冒险才刚刚开始...',
                ending: true,
                endingType: '时空学者',
                endingText: '作为协会的学者成员，你致力于研究时间的奥秘。你的研究成果帮助无数人理解了命运与选择的关系。'
            },
            together: {
                title: '并肩作战',
                text: '你和专家一起来到钟楼。两人合力破解了时间的谜题，发现了协会的真正目的：不是控制时间，而是让每个人都能做出属于自己的选择。',
                ending: true,
                endingType: '自由的选择者',
                endingText: '你理解了最重要的真理：时间的意义不在于掌控，而在于选择。你帮助更多人获得了选择自己命运的自由。'
            }
        };

        // 创建粒子效果
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }

        // 更新状态显示
        function updateStatus() {
            document.getElementById('character').textContent = gameState.character;
            document.getElementById('reputation').textContent = gameState.reputation;
            document.getElementById('wealth').textContent = gameState.wealth;
            document.getElementById('mystery').textContent = gameState.mystery;
        }

        // 打字机效果
        function typeWriter(element, text, speed = 30) {
            element.textContent = '';
            let i = 0;
            return new Promise((resolve) => {
                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        // 显示场景
        async function showScene(sceneId) {
            const scene = scenes[sceneId];
            if (!scene) return;

            gameState.currentScene = sceneId;

            // 添加淡出效果
            const card = document.getElementById('story-card');
            card.style.animation = 'none';
            setTimeout(() => {
                card.style.animation = 'fadeInScale 0.6s ease-out';
            }, 10);

            // 更新标题
            const title = document.getElementById('story-title');
            title.textContent = scene.title;

            // 打字机效果显示文本
            const text = document.getElementById('story-text');
            await typeWriter(text, scene.text, 20);

            // 显示选择或结局
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';

            if (scene.ending) {
                // 显示结局
                setTimeout(() => {
                    card.innerHTML = `
                        <div class="ending-card">
                            <div class="ending-title">🎊 ${scene.endingType} 🎊</div>
                            <div class="ending-text">${scene.endingText}</div>
                            <div class="ending-text">
                                <strong>最终状态：</strong><br>
                                声望：${gameState.reputation} | 财富：${gameState.wealth} | 神秘度：${gameState.mystery}
                            </div>
                            <button id="restart-btn" onclick="restartGame()">重新开始冒险</button>
                        </div>
                    `;
                }, 500);
            } else {
                // 显示选择按钮
                scene.choices.forEach((choice, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerHTML = `<span>${choice.text}</span>`;
                    btn.style.animationDelay = (index * 0.1) + 's';
                    btn.onclick = () => makeChoice(choice);
                    choicesDiv.appendChild(btn);
                });
            }
        }

        // 做出选择
        function makeChoice(choice) {
            // 应用效果
            if (choice.effects) {
                gameState.reputation += choice.effects.reputation || 0;
                gameState.wealth += choice.effects.wealth || 0;
                gameState.mystery += choice.effects.mystery || 0;
            }

            // 改变角色类型
            if (choice.character) {
                gameState.character = choice.character;
            }

            // 更新状态显示
            updateStatus();

            // 切换到下一个场景
            setTimeout(() => {
                showScene(choice.nextScene);
            }, 300);
        }

        // 重新开始游戏
        function restartGame() {
            gameState.character = '探索者';
            gameState.reputation = 0;
            gameState.wealth = 0;
            gameState.mystery = 0;
            gameState.currentScene = 'start';
            updateStatus();
            showScene('start');
        }

        // 初始化游戏
        window.onload = function() {
            createParticles();
            updateStatus();
            showScene('start');
        };
    </script>
</body>
</html>
