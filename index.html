<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive States</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            transition: background 1.5s ease;
            position: relative;
        }

        /* Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        /* Audio Control */
        .audio-control {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .audio-control label {
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        #bgm-upload {
            display: none;
        }

        .upload-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }

        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        #music-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #music-toggle:hover {
            transform: scale(1.2);
        }

        /* Central Display */
        #central-shape {
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 1s ease;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(180deg);
            }
        }

        #state-text {
            font-size: 32px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transition: all 0.5s ease;
        }

        /* State Buttons */
        .state-controls {
            margin-top: 60px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 600px;
        }

        .state-btn {
            padding: 20px 30px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 16px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .state-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .state-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .state-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .state-btn span {
            position: relative;
            z-index: 1;
        }

        /* Current State Info */
        #state-info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            text-align: center;
            min-width: 300px;
        }

        /* Particles */
        .particle-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .state-controls {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            #central-shape {
                width: 200px;
                height: 200px;
            }

            #state-text {
                font-size: 24px;
            }

            .state-btn {
                padding: 15px 20px;
                font-size: 14px;
            }

            .audio-control {
                top: 15px;
                right: 15px;
                padding: 10px 15px;
            }
        }

        /* State-specific styles */
        .calm-state {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .energetic-state {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .peaceful-state {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .mysterious-state {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .intense-state {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .dreamy-state {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }
    </style>
</head>
<body class="calm-state">
    <!-- Audio Control -->
    <div class="audio-control">
        <label for="bgm-upload" class="upload-btn">Upload BGM</label>
        <input type="file" id="bgm-upload" accept="audio/*">
        <button id="music-toggle" title="Play/Pause">▶</button>
        <span id="music-status" style="color: white; font-size: 12px;">No music</span>
    </div>

    <!-- Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Particle Layer -->
    <div class="particle-layer" id="particle-container"></div>

    <!-- Main Container -->
    <div class="container">
        <div id="central-shape">
            <div id="state-text">Calm</div>
        </div>

        <div class="state-controls">
            <button class="state-btn" data-state="calm"><span>Calm</span></button>
            <button class="state-btn" data-state="energetic"><span>Energetic</span></button>
            <button class="state-btn" data-state="peaceful"><span>Peaceful</span></button>
            <button class="state-btn" data-state="mysterious"><span>Mysterious</span></button>
            <button class="state-btn" data-state="intense"><span>Intense</span></button>
            <button class="state-btn" data-state="dreamy"><span>Dreamy</span></button>
        </div>
    </div>

    <!-- State Info -->
    <div id="state-info">
        Click to experience different states
    </div>

    <!-- Audio Element (Hidden) -->
    <audio id="bgm-audio" loop></audio>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // State Configuration
        const stateConfigs = {
            calm: {
                color1: '#667eea',
                color2: '#764ba2',
                particleColor: 'rgba(255, 255, 255, 0.6)',
                particleCount: 30,
                particleSpeed: 0.5,
                shapeStyle: 'circle',
                waveSpeed: 0.02
            },
            energetic: {
                color1: '#f093fb',
                color2: '#f5576c',
                particleColor: 'rgba(255, 255, 100, 0.8)',
                particleCount: 80,
                particleSpeed: 2,
                shapeStyle: 'square',
                waveSpeed: 0.08
            },
            peaceful: {
                color1: '#4facfe',
                color2: '#00f2fe',
                particleColor: 'rgba(255, 255, 255, 0.5)',
                particleCount: 20,
                particleSpeed: 0.3,
                shapeStyle: 'circle',
                waveSpeed: 0.01
            },
            mysterious: {
                color1: '#43e97b',
                color2: '#38f9d7',
                particleColor: 'rgba(67, 233, 123, 0.7)',
                particleCount: 50,
                particleSpeed: 1,
                shapeStyle: 'triangle',
                waveSpeed: 0.05
            },
            intense: {
                color1: '#fa709a',
                color2: '#fee140',
                particleColor: 'rgba(250, 112, 154, 0.8)',
                particleCount: 100,
                particleSpeed: 3,
                shapeStyle: 'square',
                waveSpeed: 0.1
            },
            dreamy: {
                color1: '#a8edea',
                color2: '#fed6e3',
                particleColor: 'rgba(168, 237, 234, 0.6)',
                particleCount: 40,
                particleSpeed: 0.8,
                shapeStyle: 'circle',
                waveSpeed: 0.03
            }
        };

        // Current State
        let currentState = 'calm';
        let particles = [];
        let waveOffset = 0;

        // Particle Class
        class Particle {
            constructor(config) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * config.particleSpeed;
                this.speedY = (Math.random() - 0.5) * config.particleSpeed;
                this.color = config.particleColor;
                this.shape = config.shapeStyle;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = this.color;

                if (this.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.shape === 'square') {
                    ctx.fillRect(this.x, this.y, this.size * 2, this.size * 2);
                } else if (this.shape === 'triangle') {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - this.size);
                    ctx.lineTo(this.x - this.size, this.y + this.size);
                    ctx.lineTo(this.x + this.size, this.y + this.size);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }

        // Initialize Particles
        function initParticles() {
            particles = [];
            const config = stateConfigs[currentState];
            for (let i = 0; i < config.particleCount; i++) {
                particles.push(new Particle(config));
            }
        }

        // Draw Wave Effect
        function drawWave() {
            const config = stateConfigs[currentState];
            waveOffset += config.waveSpeed;

            ctx.beginPath();
            ctx.moveTo(0, height / 2);

            for (let x = 0; x < width; x++) {
                const y = height / 2 + Math.sin(x * 0.01 + waveOffset) * 50;
                ctx.lineTo(x, y);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Draw wave
            drawWave();

            // Update and draw particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        // Change State
        function changeState(newState) {
            currentState = newState;

            // Update body class
            document.body.className = newState + '-state';

            // Update central text
            document.getElementById('state-text').textContent = newState.charAt(0).toUpperCase() + newState.slice(1);

            // Update shape based on state
            const shape = document.getElementById('central-shape');
            const config = stateConfigs[newState];

            if (config.shapeStyle === 'square') {
                shape.style.borderRadius = '20px';
            } else if (config.shapeStyle === 'triangle') {
                shape.style.borderRadius = '30% 70% 70% 30% / 30% 30% 70% 70%';
            } else {
                shape.style.borderRadius = '50%';
            }

            // Update info
            document.getElementById('state-info').textContent = `Current State: ${newState.toUpperCase()}`;

            // Reinitialize particles
            initParticles();
        }

        // Button Event Listeners
        document.querySelectorAll('.state-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const state = btn.getAttribute('data-state');
                changeState(state);
            });
        });

        // Audio Control
        const bgmUpload = document.getElementById('bgm-upload');
        const bgmAudio = document.getElementById('bgm-audio');
        const musicToggle = document.getElementById('music-toggle');
        const musicStatus = document.getElementById('music-status');
        let isPlaying = false;

        bgmUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                bgmAudio.src = url;
                musicStatus.textContent = file.name.substring(0, 20);
                bgmAudio.play();
                isPlaying = true;
                musicToggle.textContent = '⏸';
            }
        });

        musicToggle.addEventListener('click', () => {
            if (bgmAudio.src) {
                if (isPlaying) {
                    bgmAudio.pause();
                    musicToggle.textContent = '▶';
                    isPlaying = false;
                } else {
                    bgmAudio.play();
                    musicToggle.textContent = '⏸';
                    isPlaying = true;
                }
            }
        });

        // Initialize
        initParticles();
        animate();
    </script>
</body>
</html>
